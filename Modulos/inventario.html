<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link rel="stylesheet" href="../css/inventario.css">
    <title>Inventario</title>
</head>

<body>

    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar">
            <a class="navbar-item">VENEZIA</a>
        </div>

        <div class="navbar-menu">
            <div class="navbar-end">
                <a class="navbar-item" href="../index.html"> Home </a>

                <a class="navbar-item" href="/Modulos/pedidos.html"> Pedidos</a>

                <div class="navbar-item has-dropdown is-hoverable">
                    <a class="navbar-link"> More </a>

                    <div class="navbar-dropdown">
                        <a class="navbar-item"> About </a>
                        <a class="navbar-item is-selected"> Jobs </a>
                        <a class="navbar-item"> Contact </a>
                        <hr class="navbar-divider" />
                        <a class="navbar-item"> Report an issue </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero is-fullheight">
        <div class="hero-body">
            <div class="container">
                <div class="columns is-centered">
                    <div class="column is-5">
                        <div class="box">
                            <div class="content">

                                <div class="field">
                                    <label class="label">FORMULARIO</label>
                                    <div class="control">
                                        <input class="input" type="text" placeholder="Codigo Producto">
                                    </div>
                                </div>

                                <div class="field">
                                    <label class="label">Nombre Producto</label>
                                    <div class="control has-icons-left has-icons-right">
                                        <input class="input is-success" type="text" placeholder="Text input"
                                            value="arroz">
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <span class="icon is-small is-right">
                                            <i class="fas fa-check"></i>
                                        </span>
                                    </div>
                                    <p class="help is-success">THIS NAME IS AVAILABLE</p>
                                </div>

                                <div class="field">
                                    <label class="label">Cantidad de producto</label>
                                    <div class="control has-icons-left has-icons-right">
                                        <input class="input is-success" type="number" placeholder="Number Input"
                                            value="0000">
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-envelope"></i>
                                        </span>
                                        <span class="icon is-small is-right">
                                            <i class="fas fa-exclamation-triangle"></i>
                                        </span>
                                    </div>
                                    <p class="help is-success">INVALID STOCK</p>
                                </div>

                                <div class="field">
                                    <label class="label">Descripcion Producto</label>
                                    <div class="control has-icons-left has-icons-right">
                                        <input class="input is-success" type="text" placeholder="Text input"
                                            value="arroz quemado">
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <span class="icon is-small is-right">
                                            <i class="fas fa-check"></i>
                                        </span>
                                    </div>
                                </div>

                                <div class="field">
                                    <label class="label">Marca Producto</label>
                                    <div class="control has-icons-left has-icons-right">
                                        <input class="input is-success" type="text" placeholder="Text input"
                                            value="ROA">
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <span class="icon is-small is-right">
                                            <i class="fas fa-check"></i>
                                        </span>
                                    </div>
                                    <p class="help is-success">THIS NAME IS AVAILABLE</p>
                                </div>

                                <div class="field">
                                    <label class="label">Valor Unitario</label>
                                    <div class="control has-icons-left has-icons-right">
                                        <input class="input is-success" type="number" placeholder="number input"
                                            value="0000">
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <span class="icon is-small is-right">
                                            <i class="fas fa-check"></i>
                                        </span>
                                    </div>
                                    <p class="help is-success">THIS VALUE IS AVAILABLE</p>
                                </div>

                                <div class="field">
                                    <label class="label">Categoria Producto</label>
                                    <div class="control has-icons-left has-icons-right">
                                        <input class="input is-success" type="text" placeholder="text input"
                                            value="grano">
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <span class="icon is-small is-right">
                                            <i class="fas fa-check"></i>
                                        </span>
                                    </div>
                                    <p class="help is-success">THIS CATEGORY IS AVAILABLE</p>
                                </div>

                                <div class="field">
                                    <label class="label">Ubicacion Producto</label>
                                    <div class="control has-icons-left has-icons-right">
                                        <input class="input is-success" type="text" placeholder="text input"
                                            value="izquierda">
                                        <span class="icon is-small is-left">
                                            <i class="fas fa-user"></i>
                                        </span>
                                        <span class="icon is-small is-right">
                                            <i class="fas fa-check"></i>
                                        </span>
                                    </div>
                                    <p class="help is-success">THIS ADRESS IS AVAILABLE</p>
                                </div>

                            </div>
                            <nav class="level is-mobile">
                                <div class="level-left">
                                    <a class="level-item" aria-label="reply">
                                        <span class="icon is-small">
                                            <i class="fas fa-reply" aria-hidden="true"></i>
                                        </span>
                                    </a>
                                    <a class="level-item" aria-label="retweet">
                                        <span class="icon is-small">
                                            <i class="fas fa-retweet" aria-hidden="true"></i>
                                        </span>
                                    </a>
                                    <a class="level-item" aria-label="like">
                                        <span class="icon is-small">
                                            <i class="fas fa-heart" aria-hidden="true"></i>
                                        </span>
                                    </a>
                                </div>
                            </nav>
                            <a href="../index.html"><button class="button">VOLVER PÁGINA
                                    PRINCIPAL</button></a>
                        </div>
</body>

</html>
