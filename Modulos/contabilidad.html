<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link rel="stylesheet" href="../css/contabilidad.css">
    <title>Contabilidad</title>
</head>

<body>

    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar">
            <a class="navbar-item">VENEZIA</a>
        </div>

        <div class="navbar-menu">
            <div class="navbar-end">
                <a class="navbar-item" href="../index.html"> Home </a>
                <a class="navbar-item" href="/ProgProcedimental/Modulos/pedidos.html"> Pedidos</a>
                <div class="navbar-item has-dropdown is-hoverable">
                    <a class="navbar-link"> More </a>
                    <div class="navbar-dropdown">
                        <a class="navbar-item"> About </a>
                        <a class="navbar-item is-selected"> Jobs </a>
                        <a class="navbar-item"> Contact </a>
                        <hr class="navbar-divider" />
                        <a class="navbar-item"> Report an issue </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="columns is-centered mt-6 mx-0">
        <div class="column is-half">

            <div class="box">
                <article class="media">
                    <div class="media-content">
                        <div class="content">

                            <div class="field">
                                <label class="label">FORMULARIO CONTABILIDAD</label>
                            </div>

                            <div class="field">
                                <label class="label">Ingresos</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="number" placeholder="INGRESOS" id="Ingresos">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Egresos</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="number" placeholder="EGRESOS" id="Egresos">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-envelope"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-exclamation-triangle"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Concepto</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="text" placeholder="CONCEPTO" id="Concepto">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Fecha</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="date" placeholder="dd/mm/aaaa" id="Fecha">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Valor</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="number" placeholder="VALOR" id="Valor">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Ventas</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="number" placeholder="VENTAS" id="Ventas">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                        </div>
                        <nav class="level is-mobile">
                            <div class="level-left">
                                <a class="level-item" aria-label="reply">
                                    <span class="icon is-small">
                                        <i class="fas fa-reply" aria-hidden="true"></i>
                                    </span>
                                </a>
                                <a class="level-item" aria-label="retweet">
                                    <span class="icon is-small">
                                        <i class="fas fa-retweet" aria-hidden="true"></i>
                                    </span>
                                </a>
                                <a class="level-item" aria-label="like">
                                    <span class="icon is-small">
                                        <i class="fas fa-heart" aria-hidden="true"></i>
                                    </span>
                                </a>
                            </div>
                        </nav>

                        <a href="../index.html">
                            <button class="button">VOLVER PÁGINA PRINCIPAL</button>
                        </a>
                        <button class="button" id="guardar">Enviar</button>
                    </div>
                </article>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/contabilidad.js"></script>
</body>

</html>
