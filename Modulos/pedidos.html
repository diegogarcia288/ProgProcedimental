<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link rel="stylesheet" href="../css/pedidos.css">
    <title>Pedidos</title>
</head>

<body>

    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="navbar">
            <a class="navbar-item">VENEZIA</a>
        </div>

        <div class="navbar-menu">
            <div class="navbar-end">
                <a class="navbar-item" href="../index.html"> Home </a>
                <a class="navbar-item" href="pedidos.html"> Pedidos</a>
                <div class="navbar-item has-dropdown is-hoverable">
                    <a class="navbar-link"> More </a>
                    <div class="navbar-dropdown">
                        <a class="navbar-item"> About </a>
                        <a class="navbar-item is-selected"> Jobs </a>
                        <a class="navbar-item"> Contact </a>
                        <hr class="navbar-divider" />
                        <a class="navbar-item"> Report an issue </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="columns is-centered mt-6 mx-0">
        <div class="column is-half">

            <div class="box">
                <article class="media">
                    <div class="media-content">
                        <div class="content">

                            <div class="field">
                                <label class="label">FORMULARIO PEDIDOS</label>
                            </div>

                            <div class="field">
                                <label class="label">Producto</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="text" placeholder="Text input" value="Rata">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Dirección</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="text" placeholder="Text input" value="Cra ---">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-envelope"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-exclamation-triangle"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Nombre del Usuario</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="text" placeholder="Text input" value="Pepito">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Cantidad</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="number" placeholder="Number input" value="9999">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Método de Pago</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="text" placeholder="Text input" value="Nequi">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Pago</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="text" placeholder="Text input" value="Si/No">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                            <div class="field">
                                <label class="label">Telefono</label>
                                <div class="control has-icons-left has-icons-right">
                                    <input class="input is-success" type="number" placeholder="Number input" value="3135506022">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <span class="icon is-small is-right">
                                        <i class="fas fa-check"></i>
                                    </span>
                                </div>
                            </div>

                        </div>
                        <nav class="level is-mobile">
                            <div class="level-left">
                                <a class="level-item" aria-label="reply">
                                    <span class="icon is-small">
                                        <i class="fas fa-reply" aria-hidden="true"></i>
                                    </span>
                                </a>
                                <a class="level-item" aria-label="retweet">
                                    <span class="icon is-small">
                                        <i class="fas fa-retweet" aria-hidden="true"></i>
                                    </span>
                                </a>
                                <a class="level-item" aria-label="like">
                                    <span class="icon is-small">
                                        <i class="fas fa-heart" aria-hidden="true"></i>
                                    </span>
                                </a>
                            </div>
                        </nav>
                        
                        <a href="../index.html">
                            <button class="button">VOLVER PÁGINA PRINCIPAL</button>
                        </a>
                    </div>
                </article>
            </div>

        </div>
    </div>
</body>

</html>
